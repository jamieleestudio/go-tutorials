# Chart 默认值（对照 Java values.yaml，结构一致；镜像与探针路径换成 Go 版）。

replicaCount: 2

image:
  repository: go-tutorials
  tag: "1.0"
  pullPolicy: IfNotPresent

# 三个服务统一 8080（K8s 容器惯例；Java 版同）
services:
  - name: order-service
    port: 8080
  - name: payment-service
    port: 8080
  - name: product-service
    port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# 探针参数与 Java 版一致（路径是 Go 侧 /healthz/*）
probes:
  liveness:
    path: /healthz/liveness
    initialDelaySeconds: 20
    periodSeconds: 10
  readiness:
    path: /healthz/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

# 优雅停机（Java 版没有、Go 版补齐的增强项）
graceful:
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: ""

# 默认用户（教学版 SQLite 内存库不校验；生产换 MySQL 时覆盖）
db:
  user: sa
  password: ""
