{{/* Secret：凭据类配置（对照 Java templates/secret.yaml 的 stringData）*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce.fullname" . }}-db-secret
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.db.user | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
