# HPA 自动扩缩（对照 Java deploy/k8s/hpa.yaml，参数逐字一致）：
# 每服务 2→6 副本，CPU 70% 触发。配合 readiness 探针 —— 新副本就绪后才进 endpoints。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
