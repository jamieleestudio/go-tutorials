# 凭据类配置进 Secret（对照 Java deploy/k8s/secret.yaml 的 db-secret）。
# 教学版 SQLite 内存库用不到用户名密码 —— 保留结构展示"敏感配置走 Secret、
# 普通配置走 ConfigMap"的分层；生产换 MySQL 时这里放完整 DSN，
# 并用 sealed-secrets / external-secrets / KMS 管理（Java 版注释同款提醒）。
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  DB_USER: "sa"
  DB_PASSWORD: ""
